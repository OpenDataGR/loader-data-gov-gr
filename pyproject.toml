[project]
name = "providerharvest-service"
version = "0.1.0"
description = "External ETL/API-loader service for data.gov.gr provider harvesting -- talks to CKAN entirely over its public Action API, no CKAN process/venv dependency."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "paramiko>=3.4",
    "scp>=0.15",
    "jsonpath-ng>=1.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22",
    "sqlalchemy>=2.0",
    "bcrypt>=4.0",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
providerharvest-service = "providerharvest_service.app:main"

[tool.setuptools.packages.find]
include = ["providerharvest_service*"]
