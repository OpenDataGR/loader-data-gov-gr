[project]
name = "ftp-forwarder"
version = "0.1.0"
description = "Relays files pushed via FTP/SFTP into loader-data-gov-gr's push-ingest endpoint, and syncs its FTP accounts into a local ProFTPD database. Runs on a separate, dedicated FTP-receiving box, not on loader's own app server."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# inotify_simple only works on Linux -- kept out of the base
# dependency set so this package's core (config/sender/pool/sweep) can
# still be installed and tested on any platform; only actually running
# the live watcher (cli.py, via watcher.py) needs it for real.
linux = [
    "inotify_simple>=1.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ftp-forwarder = "ftp_forwarder.cli:main"
ftp-forwarder-sync = "ftp_forwarder.sync_cli:main"

[tool.setuptools.packages.find]
include = ["ftp_forwarder*"]
