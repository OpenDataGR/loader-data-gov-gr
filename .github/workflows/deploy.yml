name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Two runners carry the "loader" label on the same VM, so two jobs of this repo can run at once
# (e.g. the tests of one push while another push deploys). What they share is kept safe:
#   * each run's tests get their own scratch checkout, named after the run, and clean it up;
#   * everything that touches the shared git clone's worktree list or the shared virtualenv
#     (`git worktree`, `pip install`) goes through one lock, `flock`;
#   * deploys take turns -- the `concurrency` group on the deploy job -- and a newer waiting deploy
#     replaces an older waiting one, which is fine: a deploy always pulls the latest master.

jobs:
  test:
    runs-on: [self-hosted, loader]
    env:
      CI_DIR: ${{ format('{0}/ci/loader-{1}-{2}', '/home/localadmin', github.run_id, github.run_attempt) }}
      LOCK: /home/localadmin/ci/.shared.lock
    steps:
      # The tests take minutes, so they must NOT run in the live directory after a
      # `git pull`: the running server (old code, already in memory) would then serve
      # the new templates straight off disk for the whole run, and any template that
      # needs something the old code lacks would 500 until the restart in the deploy
      # job -- seen live as an Internal Server Error on a freshly redesigned page. The
      # commit under test gets its own scratch checkout; the live directory is only
      # touched by the deploy job, right before the restart.
      - name: Check out this commit in its own scratch directory
        run: |
          mkdir -p "$HOME/ci"
          cd /opt/data-projects/loader-data-gov-gr
          flock "$LOCK" bash -c '
            git fetch origin master
            git worktree prune
            # the single shared scratch directory older runs used: gone, so it cannot confuse a run
            if [ -d "$HOME/ci/loader-data-gov-gr" ]; then git worktree remove --force "$HOME/ci/loader-data-gov-gr"; fi
            if [ -d "$CI_DIR" ]; then git worktree remove --force "$CI_DIR"; fi
            git worktree add --detach "$CI_DIR" "${{ github.sha }}"
          '
          git -C "$CI_DIR" log --oneline -1

      - name: Install dependencies
        run: |
          source /opt/data-projects/loader-data-gov-gr/venv/bin/activate
          # one pip at a time in the shared virtualenv
          flock "$LOCK" pip install -r "$CI_DIR/requirements.txt"

      - name: Run tests
        run: |
          CI="$CI_DIR"
          source /opt/data-projects/loader-data-gov-gr/venv/bin/activate
          cd "$CI"
          echo "runner: $(nproc) CPU(s), $(free -m | awk '/^Mem:/ {print $2}') MB RAM"  # for judging whether parallel tests would pay
          # Guard: the tests must be exercising THIS checkout, not the live code (an
          # installed copy of the package could shadow it and give a false green).
          where=$(python -c "import os, providerharvest_service as p; print(os.path.dirname(os.path.dirname(os.path.abspath(p.__file__))))")
          test "$where" = "$CI" || { echo "::error::tests would import $where, not $CI"; exit 1; }
          python -m pytest tests -q

      - name: Remove this run's scratch checkout
        if: always()
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          flock "$LOCK" bash -c 'git worktree remove --force "$CI_DIR" || true; git worktree prune'

  deploy:
    needs: test
    runs-on: [self-hosted, loader]
    # One deploy at a time: a second one waits (and a newer one replaces an older one that is still
    # waiting, since a deploy pulls the latest master anyway). Never cancels one that is running.
    concurrency:
      group: loader-deploy
      cancel-in-progress: false
    env:
      LOCK: /home/localadmin/ci/.shared.lock
    steps:
      - name: Pull latest code
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          mkdir -p "$HOME/ci"
          flock "$LOCK" git pull   # (a test job of another run may be fetching into the same clone)

      - name: Install dependencies
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          source venv/bin/activate
          mkdir -p "$HOME/ci"
          flock "$LOCK" pip install -r requirements.txt

      - name: Reload service
        run: |
          # Clears any rate-limit lockout (systemd's StartLimitBurst/
          # StartLimitIntervalSec) from a PRIOR failed deploy before this
          # one's own restart attempt.
          sudo systemctl reset-failed loader-data-gov-gr || true
          pkill -TERM -u localadmin -f "gunicorn.*providerharvest_service.app:app" || true
          sleep 15
          systemctl is-active --quiet loader-data-gov-gr && echo "Service restarted OK" || (journalctl -u loader-data-gov-gr -n 30 --no-pager; exit 1)

      - name: Smoke test
        run: |
          # "is-active" only proves the process didn't crash -- it doesn't
          # prove the app actually answers correctly. Hit the real route.
          set -e
          curl -sf http://127.0.0.1:5002/health
