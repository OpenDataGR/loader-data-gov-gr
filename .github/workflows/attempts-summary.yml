name: Summarise failed FTP/SFTP logins (one-off, read-only)

# One-off, read-only: who has been trying to log in to the FTP box and
# failing, from where, and as which usernames -- to size the exposure of
# the public FTP/SFTP ports before deciding how to protect them. Addresses
# from our own network (84.205.) are left out. Deleted after one run.
on:
  workflow_dispatch:

jobs:
  summarise:
    runs-on: [self-hosted, loader-ftp]
    timeout-minutes: 5
    steps:
      - name: Summarise
        run: |
          LOG=/var/log/proftpd/proftpd.log
          echo "--- system log covers ---"
          sudo -n head -n 1 $LOG | cut -c1-19
          sudo -n tail -n 1 $LOG | cut -c1-19

          sudo -n grep -hiE "USER [^ ]+.*(no such user found|login failed|incorrect password|authentication failed)" $LOG > /tmp/failed-logins.txt || true
          echo "--- failed-login lines in total (all sources) ---"
          wc -l < /tmp/failed-logins.txt

          grep -v "(84\.205\." /tmp/failed-logins.txt > /tmp/failed-external.txt || true
          echo "--- ... of which from outside our network ---"
          wc -l < /tmp/failed-external.txt

          echo "--- external source addresses, most attempts first ---"
          grep -oE "\(([0-9]{1,3}\.){3}[0-9]{1,3}\[" /tmp/failed-external.txt | tr -d '([' | sort | uniq -c | sort -rn | head -15 || true

          echo "--- usernames they tried, most common first ---"
          grep -oE "USER [^ :(]+" /tmp/failed-external.txt | sort | uniq -c | sort -rn | head -20 || true

          echo "--- which port (21 = FTP, 2222 = SFTP) ---"
          grep -oE "to [^ ]+:(21|2222)\b" /tmp/failed-external.txt | grep -oE ":(21|2222)$" | sort | uniq -c || true

          echo "--- loader-auth.log: refused logins per address (since that log began) ---"
          sudo -n grep -E " PASS 530$" /var/log/proftpd/loader-auth.log | awk '{print $2}' | grep -v "^84\.205\." | sort | uniq -c | sort -rn | head -10 || true

          rm -f /tmp/failed-logins.txt /tmp/failed-external.txt
