name: Prove IPv6 login limits in ProFTPD (one-off)

# Throwaway: a second ProFTPD on spare ports (2291 FTP, 2292 SFTP), configured like production
# (UseIPv6 on, vhost 0.0.0.0, which shows as a dual-stack *:port listener). Connects to it over
# the box's own global IPv6 address and over IPv4, as accounts with different Allow lists:
#   v6-host    Allow <this box's v6 address>              via IPv6 -> in
#   v6-net     Allow <its /64>                            via IPv6 -> in
#   v6-other   Allow 2001:db8::/32                        via IPv6 -> refused
#   mixed-in   Allow 203.0.113.0/24 <its /64>             via IPv6 -> in
#   mixed-out  Allow 203.0.113.0/24 2001:db8::/32         via IPv6 -> refused
#   v4-only    Allow 127.0.0.1                            via IPv6 -> refused ; via IPv4 -> in
#   v6-host    (same as above)                            via IPv4 -> refused
# The live service on 21/2222 is not touched. Deleted again afterwards.
on:
  workflow_dispatch:
    inputs:
      useipv6:
        description: "UseIPv6 on or off"
        default: "on"

jobs:
  prove:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Start the throwaway server
        run: |
          rm -rf /tmp/v6limit && mkdir -p /tmp/v6limit && cd /tmp/v6limit
          A6=$(ip -6 addr show scope global | awk '/inet6/ {print $2; exit}' | cut -d/ -f1)
          NET6=$(python3 -c "import ipaddress,sys; print(ipaddress.ip_network(sys.argv[1]+'/64', strict=False))" "$A6")
          echo "A6=$A6" > env.txt; echo "NET6=$NET6" >> env.txt
          echo "box v6 address $A6, its /64 $NET6"
          UIDN=$(id -u); GIDN=$(id -g)
          HASH=$(openssl passwd -6 'test-pass-123')
          USERS="v6-host v6-net v6-other mixed-in mixed-out v4-only v4-other"
          sqlite3 accounts.db "CREATE TABLE ftp_account (username TEXT PRIMARY KEY, password_hash TEXT, home_directory TEXT);
            CREATE TABLE groups (groupname TEXT PRIMARY KEY, gid INTEGER, members TEXT);"
          for u in $USERS; do sqlite3 accounts.db "INSERT INTO ftp_account VALUES ('$u','$HASH','/tmp/v6limit/home');"; done
          mkdir -p home
          lim() { printf '  <IfUser %s>\n    <Limit LOGIN>\n      Allow %s\n      DenyAll\n    </Limit>\n  </IfUser>\n' "$1" "$2"; }
          {
            cat <<EOF
          Include /etc/proftpd/modules.conf
          ServerName "v6limit-proof"
          ServerType standalone
          DefaultServer on
          Port 2291
          UseIPv6 ${{ inputs.useipv6 }}
          PidFile /tmp/v6limit/proftpd.pid
          ScoreboardFile /tmp/v6limit/scoreboard
          SystemLog /tmp/v6limit/system.log
          TransferLog none
          AuthOrder mod_sql.c
          SQLBackend sqlite3
          SQLConnectInfo /tmp/v6limit/accounts.db
          SQLAuthTypes Crypt
          SQLUserInfo ftp_account username password_hash NULL NULL home_directory NULL
          SQLDefaultUID $UIDN
          SQLDefaultGID $GIDN
          RequireValidShell off
          <Global>
          EOF
            [ "${{ inputs.useipv6 }}" = on ] && lim v6-host "$A6" || true
            [ "${{ inputs.useipv6 }}" = on ] && lim v6-net "$NET6" || true
            [ "${{ inputs.useipv6 }}" = on ] && lim v6-other "2001:db8::/32" || true
            [ "${{ inputs.useipv6 }}" = on ] && lim mixed-in "203.0.113.0/24 $NET6" || true
            [ "${{ inputs.useipv6 }}" = on ] && lim mixed-out "203.0.113.0/24 2001:db8::/32" || true
            lim v4-only "127.0.0.1"
            lim v4-other "203.0.113.0/24"
            cat <<EOF
          </Global>
          <VirtualHost 0.0.0.0>
            Port 2292
            <IfModule mod_sftp.c>
              SFTPEngine on
              SFTPHostKey /etc/proftpd/ssh_host_rsa_key
              SFTPAuthMethods password
            </IfModule>
            SQLBackend sqlite3
            SQLConnectInfo /tmp/v6limit/accounts.db
            SQLAuthTypes Crypt
            SQLUserInfo ftp_account username password_hash NULL NULL home_directory NULL
            SQLDefaultUID $UIDN
            SQLDefaultGID $GIDN
            RequireValidShell off
          </VirtualHost>
          EOF
          } | sed 's/^          //' > proftpd.conf
          sudo -n proftpd -t -c /tmp/v6limit/proftpd.conf
          sudo -n nohup proftpd -n -c /tmp/v6limit/proftpd.conf > server.out 2>&1 &
          sleep 4
          sudo -n ss -tlnp | grep -E ':2291 |:2292 ' || { echo "::error::throwaway server did not start"; cat server.out; exit 1; }

      - name: Try each account over IPv6 and IPv4, FTP and SFTP
        run: |
          cd /tmp/v6limit
          . ./env.txt
          python3 -m venv v && ./v/bin/pip install -q paramiko
          cat > try.py <<'PY'
          import ftplib, os, sys, socket, paramiko, logging
          logging.getLogger("paramiko").setLevel(logging.CRITICAL)
          PW = "test-pass-123"
          A6 = os.environ["A6"]
          # (user, via, expected-in)
          cases = [("v6-host", A6, True), ("v6-net", A6, True), ("v6-other", A6, False),
                   ("mixed-in", A6, True), ("mixed-out", A6, False), ("v4-only", A6, False),
                   ("v4-only", "127.0.0.1", True), ("v6-host", "127.0.0.1", False),
                   ("v4-other", "127.0.0.1", False)]
          if os.environ.get("V6ON") != "on":
              cases = [c for c in cases if c[1] == "127.0.0.1" and c[0].startswith("v4-")]
          ok = True
          for user, host, want in cases:
              for proto, port in (("FTP", 2291), ("SFTP", 2292)):
                  try:
                      if proto == "FTP":
                          f = ftplib.FTP(); f.connect(host, port, timeout=15); f.login(user, PW); f.quit()
                      else:
                          c = paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                          c.connect(host, port, username=user, password=PW, allow_agent=False, look_for_keys=False, timeout=15); c.close()
                      got, note = True, "LOGGED IN"
                  except (ftplib.error_perm, paramiko.AuthenticationException) as e:
                      got, note = False, "refused"
                  except Exception as e:
                      got, note = None, "ERROR %r" % e
                  good = got == want
                  ok &= good
                  print("%-5s %-9s via %-40s expected %-7s -> %-9s [%s]" % (proto, user, host, "in" if want else "refused", note, "ok" if good else "WRONG"))
          sys.exit(0 if ok else 1)
          PY
          A6=$A6 V6ON=${{ inputs.useipv6 }} ./v/bin/python try.py

      - name: What did ProFTPD log?
        if: always()
        run: sudo -n ls -la /tmp/v6limit/ || true

      - name: Tear the throwaway server down
        if: always()
        run: |
          sudo -n kill "$(cat /tmp/v6limit/proftpd.pid 2>/dev/null)" 2>/dev/null || true
          sleep 1
          sudo -n rm -rf /tmp/v6limit
          sudo -n ss -tlnp | grep -E ':2291 |:2292 ' && echo "::warning::throwaway server still listening" || echo "throwaway server gone"
