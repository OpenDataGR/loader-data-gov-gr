name: Provision FTP box

# Idempotent and safe to leave in the repo / re-run at any time --
# same "prove it's redeployable, not a one-off hand-run script"
# convention as provision-postgres.yml. Provisions the dedicated
# external FTP/SFTP-receiving box (a separate machine from loader's
# own app VM -- see ftp-forwarder/README.md for why): installs
# ProFTPD (mod_sql-backed accounts, mod_sftp for SFTP -- the exact
# same proven, already-debugged recipe deploy/README.md documents for
# the app VM's own FTP-push feature, just with its own dedicated local
# account database instead of loader's config DB, since this is a
# different machine entirely), the account-sync service (keeps that
# local database in sync with loader's own admin panel), and the
# file-relay service (watches every account currently in that same
# local database -- no separate hand-maintained config needed, see
# ftp-forwarder/ftp_forwarder/accounts.py -- and forwards completed
# uploads to loader's trusted-relay ingest endpoint). Safe to start
# the relay with zero accounts configured yet: it just idles.
on:
  workflow_dispatch:
    inputs:
      unban_ip:
        description: "Optional: an address fail2ban has banned that should be let back in (a provider who locked themselves out)"
        required: false
        default: ""

jobs:
  provision:
    runs-on: [self-hosted, loader-ftp]
    env:
      SYNC_KEY: ${{ secrets.LOADER_FTP_SYNC_KEY }}
      UNBAN_IP: ${{ github.event.inputs.unban_ip }}
    steps:
      - name: Pull the ftp-forwarder checkout up to date
        run: |
          # This repo is private -- a plain unauthenticated `git clone`
          # from this job would fail, same reason deploy.yml itself
          # only ever does `git pull` too. The *first* clone here is a
          # one-time, manually-authenticated step (see this repo's own
          # deploy/README.md "one-time setup" for the pattern, and
          # ftp-forwarder/README.md for this box's own copy of it) --
          # this workflow only ever updates what's already there.
          if [ ! -d /opt/data-projects/loader-ftp-forwarder/.git ]; then
            echo "::error::/opt/data-projects/loader-ftp-forwarder is not a git checkout yet -- do the one-time manual clone from ftp-forwarder/README.md first."
            exit 1
          fi
          cd /opt/data-projects/loader-ftp-forwarder
          git pull

      - name: Install ProFTPD (core, SQLite backend, crypto/sftp module) and Python venv support
        run: |
          sudo apt update
          sudo apt install -y proftpd-core proftpd-mod-sqlite proftpd-mod-crypto sqlite3 python3-venv fail2ban iptables

      - name: Enable the SQL and SFTP modules (idempotent -- no-op if already uncommented)
        run: |
          sudo sed -i \
            -e 's/^#LoadModule mod_sql\.c/LoadModule mod_sql.c/' \
            -e 's/^#LoadModule mod_sql_sqlite\.c/LoadModule mod_sql_sqlite.c/' \
            -e 's/^#LoadModule mod_sql_passwd\.c/LoadModule mod_sql_passwd.c/' \
            -e 's/^#LoadModule mod_sftp\.c/LoadModule mod_sftp.c/' \
            /etc/proftpd/modules.conf
          grep -n "^LoadModule mod_sql\|^LoadModule mod_sftp" /etc/proftpd/modules.conf

      - name: Create the dedicated, non-login system account every virtual user maps to
        run: |
          id virtualftp 2>/dev/null || sudo useradd --system --no-create-home --shell /usr/sbin/nologin virtualftp
          id virtualftp

      - name: Create the FTP upload root
        run: |
          sudo mkdir -p /srv/ftp
          sudo chown virtualftp:virtualftp /srv/ftp
          # 2775, not 755: the file-relay service (running as this
          # runner's own user, not root or virtualftp -- see below)
          # needs to create/write into each account's .forwarded/
          # archive subfolder. Group-write plus setgid so every new
          # subdirectory a provider's upload creates stays owned by
          # the virtualftp group too, not just the top-level dir.
          sudo chmod 2775 /srv/ftp
          sudo usermod -aG virtualftp "$(whoami)"

      - name: Generate SSH host keys for mod_sftp, if missing
        run: |
          if [ ! -f /etc/proftpd/ssh_host_ed25519_key ]; then
            sudo ssh-keygen -t ed25519 -f /etc/proftpd/ssh_host_ed25519_key -N ''
          fi
          if [ ! -f /etc/proftpd/ssh_host_rsa_key ]; then
            sudo ssh-keygen -t rsa -b 4096 -f /etc/proftpd/ssh_host_rsa_key -N ''
          fi
          sudo chown root:root /etc/proftpd/ssh_host_*_key
          sudo chmod 600 /etc/proftpd/ssh_host_*_key

      - name: Write the FTP (port 21) and SFTP (port 2222) SQL-backed virtual-user config
        run: |
          VUID=$(id -u virtualftp)
          VGID=$(id -g virtualftp)
          sudo tee /etc/proftpd/conf.d/loader-virtual-users.conf > /dev/null <<EOF
          SQLBackend sqlite3
          SQLConnectInfo /etc/proftpd/ftp-accounts.db
          SQLPasswordEngine on
          SQLAuthTypes bcrypt
          SQLUserInfo ftp_account username password_hash NULL NULL home_directory NULL
          SQLDefaultUID $VUID
          SQLDefaultGID $VGID
          RequireValidShell off
          DefaultRoot ~
          # One line per login attempt: epoch, client address, user, command, reply code
          # (230 = success). The account-sync service tails this to tell loader where
          # each provider connects from -- plain FTP's TransferLog doesn't record
          # SFTP at all, and neither log records a successful login as such.
          LogFormat loader_auth "%{%s}t %a %u %m %s"
          ExtendedLog /var/log/proftpd/loader-auth.log AUTH loader_auth
          # The same attempts again for loader's failed-login report, which also needs
          # the server port (21 FTP / 2222 SFTP) and the username as typed. A separate
          # file so the fail2ban filter above keeps its shape. Username last: it may
          # contain spaces.
          LogFormat loader_attempt "%{%s}t %a %p %m %s %U"
          ExtendedLog /var/log/proftpd/loader-attempts.log AUTH loader_attempt
          EOF

          sudo tee /etc/proftpd/conf.d/loader-sftp.conf > /dev/null <<EOF
          <VirtualHost 0.0.0.0>
            Port 2222
            <IfModule mod_sftp.c>
              SFTPEngine on
              SFTPHostKey /etc/proftpd/ssh_host_rsa_key
              SFTPHostKey /etc/proftpd/ssh_host_ed25519_key
              SFTPAuthMethods password
              SFTPCompression delayed
            </IfModule>
            SQLBackend sqlite3
            SQLConnectInfo /etc/proftpd/ftp-accounts.db
            SQLPasswordEngine on
            SQLAuthTypes bcrypt
            SQLUserInfo ftp_account username password_hash NULL NULL home_directory NULL
            SQLDefaultUID $VUID
            SQLDefaultGID $VGID
            RequireValidShell off
            DefaultRoot ~
            ExtendedLog /var/log/proftpd/loader-auth.log AUTH loader_auth
            ExtendedLog /var/log/proftpd/loader-attempts.log AUTH loader_attempt
          </VirtualHost>
          EOF
          # The all-commands log used once to see what mod_sftp records; no longer configured.
          sudo rm -f /var/log/proftpd/loader-discovery.log
          sudo proftpd -t

      - name: Install the ftp-forwarder Python package
        run: |
          cd /opt/data-projects/loader-ftp-forwarder/ftp-forwarder
          python3 -m venv .venv
          ./.venv/bin/pip install -e ".[dev,linux]"

      - name: Store the loader FTP-sync key (its own restricted file, never inline in any config)
        run: |
          sudo mkdir -p /etc/ftp-forwarder/secrets
          # Where the account-sync service remembers how far it has delivered the
          # failed-login log (root-only: it runs as root).
          sudo mkdir -p /var/lib/ftp-forwarder
          echo -n "$SYNC_KEY" | sudo tee /etc/ftp-forwarder/secrets/ftp-sync.key > /dev/null
          # Group-readable by virtualftp, not just root: both services
          # that need this key (account-sync, running as root, and the
          # file-relay, running as this runner's own user -- see below)
          # can read it this way, without the relay needing root.
          sudo chown root:virtualftp /etc/ftp-forwarder/secrets/ftp-sync.key
          sudo chmod 640 /etc/ftp-forwarder/secrets/ftp-sync.key

      - name: Install and (re)start the account-sync service
        run: |
          # Always restart, not just `enable --now` -- this workflow is
          # re-run whenever the ftp-forwarder package's own code
          # changes (see the earlier "pip install -e" step), and an
          # already-active unit wouldn't otherwise pick up new code
          # until something restarted it anyway.
          sudo cp /opt/data-projects/loader-ftp-forwarder/ftp-forwarder/deploy/loader-ftp-forwarder-sync.service /etc/systemd/system/
          sudo systemctl daemon-reload
          sudo systemctl enable loader-ftp-forwarder-sync
          sudo systemctl restart loader-ftp-forwarder-sync
          sleep 3
          sudo systemctl is-active --quiet loader-ftp-forwarder-sync && echo "sync service running" || (sudo journalctl -u loader-ftp-forwarder-sync -n 30 --no-pager; exit 1)

      - name: Confirm the local account database was actually created by the sync
        run: |
          sudo sqlite3 /etc/proftpd/ftp-accounts.db ".tables"
          sudo sqlite3 /etc/proftpd/ftp-accounts.db "SELECT count(*) AS account_count FROM ftp_account;"
          # Group-readable by virtualftp too -- contains only bcrypt
          # hashes (see admin_ftp.py's own reasoning for why that's
          # safe to expose to whatever's meant to consume this file),
          # and the file-relay service (accounts.py) needs to read it
          # without running as root.
          sudo chown root:virtualftp /etc/proftpd/ftp-accounts.db
          sudo chmod 640 /etc/proftpd/ftp-accounts.db

      - name: Enable and (re)start ProFTPD
        run: |
          sudo systemctl enable proftpd
          sudo systemctl restart proftpd
          sudo systemctl is-active --quiet proftpd && echo "proftpd running" || (sudo journalctl -u proftpd -n 30 --no-pager; exit 1)

      - name: Confirm both listeners are actually up
        run: sudo ss -tlnp | grep -E ':21 |:2222 '

      - name: Ban addresses that keep failing to log in (fail2ban)
        run: |
          # The FTP/SFTP ports are open to the whole internet with no
          # firewall in front, and are scanned constantly (1,000+ refused
          # root/admin logins from a single address in a day). fail2ban
          # watches the login log ProFTPD writes for both servers
          # (`ExtendedLog ... loader_auth`, see above): "PASS 530" is a
          # refused login. Five within ten minutes bans that address from
          # both ports for an hour, doubling for each repeat up to a week --
          # short enough that a provider who mistyped a password waits out
          # the hour, long enough to make scanning this box pointless.
          test -f /var/log/proftpd/loader-auth.log || { echo "::error::loader-auth.log doesn't exist -- ProFTPD isn't logging logins"; exit 1; }

          sudo tee /etc/fail2ban/filter.d/loader-ftp.conf > /dev/null <<'EOF'
          [Definition]
          # The epoch is consumed by datepattern before this is applied, so the
          # line it sees starts at the client address.
          failregex = ^\s*<HOST> \S+ PASS 530\s*$
          ignoreregex =
          datepattern = ^{EPOCH}
          EOF

          sudo tee /etc/fail2ban/jail.d/loader-ftp.local > /dev/null <<'EOF'
          [loader-ftp]
          enabled = true
          filter = loader-ftp
          logpath = /var/log/proftpd/loader-auth.log
          port = 21,2222
          maxretry = 5
          findtime = 10m
          bantime = 1h
          bantime.increment = true
          bantime.factor = 2
          bantime.maxtime = 1w
          ignoreip = 127.0.0.1/8 ::1
          EOF

          # A second jail on the same filter for scanners that stay under the
          # first one's radar by trying once every few minutes (one such address
          # made 8 attempts in 25 minutes, never 5 in 10). Eight refused logins in
          # six hours bans for a day, doubling for repeats up to a week. Its bans
          # are reported and lifted from the admin page like the first jail's.
          sudo tee /etc/fail2ban/jail.d/loader-ftp-slow.local > /dev/null <<'EOF'
          [loader-ftp-slow]
          enabled = true
          filter = loader-ftp
          logpath = /var/log/proftpd/loader-auth.log
          port = 21,2222
          maxretry = 8
          findtime = 6h
          bantime = 1d
          bantime.increment = true
          bantime.factor = 2
          bantime.maxtime = 1w
          ignoreip = 127.0.0.1/8 ::1
          EOF

          # The distro's own sshd jail (enabled by defaults-debian.conf) guards port
          # 22 only, but sshd also listens on 7002 -- a scanner banned on 22 could keep
          # trying there (confirmed in the live iptables rules: `--dports 22`). Its
          # defaults are also gentle (10-minute bans; 6,457 refused passwords in two
          # days). Same ban shape as the FTP jail, on both ports.
          sudo tee /etc/fail2ban/jail.d/loader-sshd.local > /dev/null <<'EOF'
          [sshd]
          enabled = true
          port = 22,7002
          maxretry = 5
          findtime = 10m
          bantime = 1h
          bantime.increment = true
          bantime.factor = 2
          bantime.maxtime = 1w
          ignoreip = 127.0.0.1/8 ::1
          EOF

          # Prove the filter matches what ProFTPD really writes, on a made-up log:
          # a refused login must count, a successful one and a bare USER must not.
          now=$(date +%s)
          printf '%s 203.0.113.9 - PASS 530\n%s 203.0.113.9 - USER 331\n%s 203.0.113.9 alice PASS 230\n' "$now" "$now" "$now" > /tmp/f2b-selftest.log
          sudo fail2ban-regex /tmp/f2b-selftest.log loader-ftp | tee /tmp/f2b-selftest.out
          grep -q "Failregex: 1 total" /tmp/f2b-selftest.out || { echo "::error::the fail2ban filter did not match exactly one refused login"; exit 1; }
          rm -f /tmp/f2b-selftest.log /tmp/f2b-selftest.out

          sudo systemctl enable fail2ban
          # A reload, not a restart, when it is already running: a restart flushes every
          # current ban (and only some come back), and this workflow gets re-run.
          if systemctl is-active --quiet fail2ban; then
            sudo fail2ban-client reload
          else
            sudo systemctl start fail2ban
          fi
          sleep 3
          sudo systemctl is-active --quiet fail2ban && echo "fail2ban running" || (sudo journalctl -u fail2ban -n 30 --no-pager; exit 1)
          sudo fail2ban-client status loader-ftp
          sudo fail2ban-client status loader-ftp-slow
          sudo fail2ban-client status sshd
          # Both ports must be in the sshd ban rule, not just 22. A reload re-reads the
          # jail but does not re-create its firewall rule, so when the rule is still the
          # old one restart just that jail (its unexpired bans are restored).
          if ! sudo iptables -S INPUT | grep f2b-sshd | grep -q -- '--dports 22,7002'; then
            sudo fail2ban-client restart sshd
            sleep 3
          fi
          sudo iptables -S INPUT | grep f2b-sshd | tee /tmp/f2b-sshd-rule.out
          grep -q -- '--dports 22,7002' /tmp/f2b-sshd-rule.out || { echo "::error::the sshd ban does not cover port 7002"; exit 1; }
          rm -f /tmp/f2b-sshd-rule.out

      - name: Install and (re)start the file-relay service
        run: |
          # User=localadmin in the checked-in unit file is a
          # placeholder matching the main app VM's own convention --
          # this box's actual operational user is whoever this runner
          # itself runs as (confirmed via the one-time manual clone in
          # ftp-forwarder/README.md, not assumed), so that's who this
          # service actually runs as too.
          sudo sed "s/^User=localadmin/User=$(whoami)/" \
            /opt/data-projects/loader-ftp-forwarder/ftp-forwarder/deploy/loader-ftp-forwarder.service \
            | sudo tee /etc/systemd/system/loader-ftp-forwarder.service > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl enable loader-ftp-forwarder
          sudo systemctl restart loader-ftp-forwarder
          sleep 3
          sudo systemctl is-active --quiet loader-ftp-forwarder && echo "file-relay service running" || (sudo journalctl -u loader-ftp-forwarder -n 30 --no-pager; exit 1)

      - name: Let an address back in, if one was asked for
        run: |
          if [ -n "$UNBAN_IP" ]; then
            # The input is free text -- only ever pass something that looks like an address.
            if ! printf '%s' "$UNBAN_IP" | grep -Eq '^[0-9a-fA-F:.]{2,45}$'; then
              echo "::error::'$UNBAN_IP' does not look like an IP address"
              exit 1
            fi
            for jail in loader-ftp loader-ftp-slow sshd; do
              sudo fail2ban-client set "$jail" unbanip "$UNBAN_IP" || true
            done
          fi
          sudo fail2ban-client status loader-ftp
          sudo fail2ban-client status loader-ftp-slow
