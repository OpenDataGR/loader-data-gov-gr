name: Teardown old shared-postgres (one-off)

# One-time cleanup: removes the shared-postgres container/volume/
# directory from the earlier (reverted) shared-infra approach. Nothing
# of real value was ever stored in it -- only a connectivity test.
# Deleted from the repo immediately after use.
on:
  workflow_dispatch:

jobs:
  teardown:
    runs-on: [self-hosted, loader]
    steps:
      - name: Stop and remove the container + its volume
        run: |
          if [ -d /opt/shared-infra/postgres ]; then
            cd /opt/shared-infra/postgres
            sudo docker compose down -v || true
          else
            echo "directory already gone"
          fi

      - name: Remove the old directory
        run: sudo rm -rf /opt/shared-infra

      - name: Remove the stale LOADER_HARVEST_DB_URL (its credentials no longer exist)
        run: |
          sudo sed -i '/^LOADER_HARVEST_DB_URL=/d' /etc/loader-data-gov-gr.env
          echo "--- resulting file (keys only) ---"
          sudo sed 's/=.*/=<redacted>/' /etc/loader-data-gov-gr.env

      - name: Confirm gone
        run: |
          sudo docker ps -a --filter name=shared-postgres
          sudo docker volume ls | grep shared || echo "no shared-* volumes remain"
