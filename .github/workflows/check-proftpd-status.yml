name: Check ProFTPD status (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, loader]
    steps:
      - name: Check whether ProFTPD is running and what it's listening on
        run: |
          sudo systemctl status proftpd --no-pager || true
          echo "--- listening sockets ---"
          sudo ss -tlnp | grep -E ':21 |:2222 ' || echo "nothing listening on 21 or 2222"
