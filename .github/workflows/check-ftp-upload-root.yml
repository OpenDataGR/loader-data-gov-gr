name: Check LOADER_FTP_UPLOAD_ROOT (one-off, read-only)

# One-off: confirms whether LOADER_FTP_UPLOAD_ROOT is set on the main
# VM's env file, and to what -- needs to match the actual upload root
# ProFTPD uses on the external FTP-receiving box (/srv/ftp), not this
# VM's own default (/srv/ftp-uploads, left over from the original
# proof-of-concept when FTP-push was tested directly on this VM)
# before any real provider account can be created via /admin/ftp.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, loader]
    steps:
      - name: Print the current setting
        run: |
          if sudo grep -q '^LOADER_FTP_UPLOAD_ROOT=' /etc/loader-data-gov-gr.env 2>/dev/null; then
            sudo grep '^LOADER_FTP_UPLOAD_ROOT=' /etc/loader-data-gov-gr.env
          else
            echo "not set in /etc/loader-data-gov-gr.env -- default (/srv/ftp-uploads) applies"
          fi
