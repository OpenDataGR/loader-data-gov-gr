name: Set LOADER_PUBLIC_BASE_URL (one-off)

# One-time: adds LOADER_PUBLIC_BASE_URL to the env file if it isn't
# already there, then restarts the service to pick it up (editing the
# env file alone does not affect an already-running process). Deleted
# after a single run, same as every other one-off workflow.
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: [self-hosted, loader]
    steps:
      - name: Add the env var if missing, then restart
        run: |
          if sudo grep -q '^LOADER_PUBLIC_BASE_URL=' /etc/loader-data-gov-gr.env 2>/dev/null; then
            echo "already set:"
            sudo grep '^LOADER_PUBLIC_BASE_URL=' /etc/loader-data-gov-gr.env
          else
            echo "LOADER_PUBLIC_BASE_URL=https://loader.data.gov.gr" | sudo tee -a /etc/loader-data-gov-gr.env > /dev/null
            echo "added."
          fi
          sudo pkill -TERM -u localadmin -f "gunicorn.*providerharvest_service.app:app" || true
          sleep 3
          curl -sf http://127.0.0.1:5002/health && echo " -- service back up"
