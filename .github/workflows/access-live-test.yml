name: Access rules live test (one-off)

# One-off. Puts TEMPORARY test rules straight into loader's database (each expires after 10
# minutes on its own), so the real enforcement can be watched: loader's 403, the FTP box's
# firewall chain and fail2ban ignore list. Deleted again afterwards.
#   setup      block the tester's address (found by a marker username they just tried to log in
#              with), block 203.0.113.0/24, allow 192.0.2.0/24
#   allow-mine whitelist the tester's address too (whitelist must win over the blacklist)
#   cleanup    remove every test rule and the marker attempt rows
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "setup | allow-mine | cleanup"
        required: true
        default: "setup"
      marker:
        description: "The username the tester tried at /admin/login, to find their address"
        required: false
        default: ""

jobs:
  run:
    runs-on: [self-hosted, loader]
    steps:
      - name: Do it
        env:
          MODE: ${{ github.event.inputs.mode }}
          MARKER: ${{ github.event.inputs.marker }}
        run: |
          python3 - <<'PY'
          import datetime, os, sqlite3, sys, uuid

          mode, marker = os.environ["MODE"], os.environ["MARKER"]
          conn = sqlite3.connect("/opt/data-projects/loader-data-gov-gr/data/loader.db")
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          fmt = "%Y-%m-%d %H:%M:%S.%f"

          def mine():
              row = conn.execute("SELECT ip FROM ftp_login_attempt WHERE username = ? ORDER BY at DESC LIMIT 1", (marker,)).fetchone()
              if not row:
                  sys.exit("no attempt with username %r found" % marker)
              return row[0]

          def add(kind, cidr):
              conn.execute(
                  "INSERT OR REPLACE INTO access_rule (id, kind, cidr, note, created_by, created_at, expires_at) VALUES (?,?,?,?,?,?,?)",
                  (str(uuid.uuid4()), kind, cidr, "live test", "live-test", now.strftime(fmt), (now + datetime.timedelta(minutes=10)).strftime(fmt)),
              )
              print("added", kind, cidr)

          if mode == "setup":
              ip = mine()
              print("the tester's address as loader sees it:", ip)
              add("block", ip + "/32"); add("block", "203.0.113.0/24"); add("allow", "192.0.2.0/24")
          elif mode == "harmless":
              # Reserved documentation ranges: no real traffic comes from them, so nobody is affected.
              add("block", "203.0.113.0/24"); add("allow", "192.0.2.0/24")
          elif mode == "allow-mine":
              add("allow", mine() + "/32")
          elif mode == "cleanup":
              n = conn.execute("DELETE FROM access_rule WHERE created_by = 'live-test'").rowcount
              m = conn.execute("DELETE FROM ftp_login_attempt WHERE username LIKE 'live-test-%'").rowcount
              print("removed %d test rule(s) and %d marker attempt(s)" % (n, m))
          else:
              sys.exit("unknown mode")
          conn.commit()
          print("rules now:")
          for row in conn.execute("SELECT kind, cidr, note, expires_at FROM access_rule ORDER BY kind, cidr"):
              print("  ", row)
          PY
