name: Retention check (one-off)

# One-off, read-only: the web server's record of requests to the retention page (time, method, status),
# and the source config as stored. Changes nothing. Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  loader:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          echo "--- requests to the retention page (time, method+path, status, bytes)"
          for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
            sudo -n grep -h "/retention" "$f" 2>/dev/null | awk '{print $4, $6, $7, $9, $10}' ; done | sort | tail -20
          echo "(end of requests)"
          python3 - <<'PY'
          import json, sqlite3
          conn = sqlite3.connect("file:/opt/data-projects/loader-data-gov-gr/data/loader.db?mode=ro", uri=True)
          for name, config in conn.execute("SELECT name, config FROM provider_source ORDER BY name"):
              c = json.loads(config or "{}")
              print("%-28s stored retention keys: %s" % (name, {k: v for k, v in c.items() if k.startswith("retention")} or "none"))
          PY
