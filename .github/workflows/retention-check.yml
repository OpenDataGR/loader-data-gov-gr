name: Retention check (one-off)

# One-off, read-only: where the web server logs requests and whether anything about admin source pages
# shows up there. Prints no addresses or cookies, only time, method, path and status. Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  loader:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          echo "--- nginx log files"
          sudo -n ls -la /var/log/nginx/ 2>&1 | head -12
          echo "--- vhost log settings"
          sudo -n grep -n "access_log\|error_log" /etc/nginx/sites-enabled/* /etc/nginx/nginx.conf 2>&1 | head -8
          for f in /var/log/nginx/access.log; do
            echo "--- lines in $f:" ; sudo -n wc -l < "$f"
            echo "--- admin page requests today (time method path status) -- newest 15"
            sudo -n grep -h "/admin/sources\|/retention" "$f" | awk '{print $4, $6, $7, $9}' | tail -15
          done
          echo "--- application log: POSTs seen by the service in the last 2 hours (path only)"
          journalctl -u loader-data-gov-gr --since "-2hours" --no-pager | grep -i "retention\|POST /admin/sources" | tail -8 || true
          echo "(end)"
