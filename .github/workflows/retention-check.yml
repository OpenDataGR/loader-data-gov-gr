name: Retention check (one-off)

# One-off, read-only: requests to the retention page as the web server logged them (JSON log: time, method,
# path, status -- nothing else is printed), and the source config as stored. Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  loader:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          sudo -n cat /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null | python3 -c "
          import json, sys
          keys_shown = False
          hits = []
          for line in sys.stdin:
              try:
                  d = json.loads(line)
              except ValueError:
                  continue
              if not keys_shown:
                  print('log fields:', sorted(d.keys())); keys_shown = True
              blob = json.dumps(d)
              if '/retention' in blob:
                  hits.append(d)
          print('requests mentioning /retention:', len(hits))
          for d in hits[-15:]:
              pick = {k: v for k, v in d.items() if k in ('time', 'time_local', 'timestamp', 'method', 'request_method', 'uri', 'request_uri', 'request', 'status', 'bytes_sent', 'body_bytes_sent')}
              print(pick)
          "
          python3 - <<'PY'
          import json, sqlite3
          conn = sqlite3.connect("file:/opt/data-projects/loader-data-gov-gr/data/loader.db?mode=ro", uri=True)
          for name, config in conn.execute("SELECT name, config FROM provider_source ORDER BY name"):
              c = json.loads(config or "{}")
              print("%-28s stored retention keys: %s" % (name, {k: v for k, v in c.items() if k.startswith("retention")} or "none"))
          PY
