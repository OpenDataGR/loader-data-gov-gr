name: Peek at ProFTPD logs (one-off, read-only)

# One-off, read-only: shows what ProFTPD actually records about a
# transfer on the FTP box (the earlier end-to-end dry run left an SFTP
# and a plain-FTP upload in it), so a log parser can be written against
# the real format instead of a guessed one. Deleted after one run.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    timeout-minutes: 5
    steps:
      - name: Show the transfer log
        run: |
          sudo -n ls -la /var/log/proftpd/
          echo "--- TransferLog / SystemLog / UseReverseDNS in the config ---"
          sudo -n grep -rhE "^\s*(TransferLog|SystemLog|UseReverseDNS|LogFormat|ExtendedLog)" /etc/proftpd/proftpd.conf /etc/proftpd/conf.d/ || true
          echo "--- xferlog (last 20) ---"
          sudo -n tail -n 20 /var/log/proftpd/xferlog || true
          echo "--- dry-run lines in the system log ---"
          sudo -n grep -h "zz-dryrun" /var/log/proftpd/proftpd.log | tail -n 12 || true
