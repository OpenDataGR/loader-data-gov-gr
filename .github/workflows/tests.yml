name: Tests

# Plain Python job, no Docker/CKAN at all -- this service is designed
# to run standalone (see README.md), so this workflow verifies exactly
# that: install and test with nothing CKAN-related on the path.
on:
  workflow_dispatch: {}
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install providerharvest-service
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest tests -q
