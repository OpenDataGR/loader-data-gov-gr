name: Peek at the FTP box SSH logs (one-off)

# Read-only. Shows how sshd is set up on the FTP box and what its failed
# logins really look like, so a parser can be written against the real format
# and not a guessed one. Deleted again once that is done.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Which ports does the sshd ban actually block?
        run: |
          echo "--- effective sshd jail settings"
          sudo -n fail2ban-client get sshd bantime
          sudo -n fail2ban-client get sshd maxretry
          sudo -n fail2ban-client get sshd findtime
          sudo -n fail2ban-client get sshd actions
          echo "--- jail definition for sshd (port line)"
          sudo -n fail2ban-client --dump 2>/dev/null | grep -Ei "sshd.*(port|multiport)|set sshd action" | head -20 || true
          echo "--- INPUT chain rules that send traffic to the fail2ban chains"
          sudo -n iptables -S INPUT | grep -i f2b || true
          echo "--- the sshd chain itself (first lines)"
          sudo -n iptables -S f2b-sshd | head -8 || true
          echo "--- debian defaults file"
          cat /etc/fail2ban/jail.d/defaults-debian.conf

      - name: Counts of failure kinds, last 2 days
        run: |
          sudo -n journalctl -u ssh --no-pager --since "-2 days" 2>/dev/null | grep -Eoi 'failed password|invalid user|connection closed by authenticating user|maximum authentication attempts exceeded|disconnected from authenticating user' | sort | uniq -c | sort -rn || true
          echo "--- which port were they on (sshd logs the client's port, not the server's)"
          sudo -n journalctl -u ssh --no-pager --since "-2 days" 2>/dev/null | grep -c 'Failed password' || true
