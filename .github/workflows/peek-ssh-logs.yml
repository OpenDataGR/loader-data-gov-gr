name: Peek at the FTP box SSH logs (one-off)

# Read-only one-off. Deleted again once the question it asks is answered.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Why has the loader-ftp jail no firewall chain?
        run: |
          echo "--- fail2ban log since the restart (errors and loader-ftp lines)"
          sudo -n awk '$1 == "2026-10-02" && $2 >= "07:06:50"' /var/log/fail2ban.log | grep -Ev 'Found|Ignore' | head -60
          echo "--- jail loader-ftp actions"
          sudo -n fail2ban-client get loader-ftp actions
          echo "--- effective loader-ftp settings"
          for k in maxretry findtime bantime logpath; do echo -n "$k: "; sudo -n fail2ban-client get loader-ftp $k; done
          echo "--- jail files"
          ls -l /etc/fail2ban/jail.d/
          cat /etc/fail2ban/jail.d/loader-ftp.local
