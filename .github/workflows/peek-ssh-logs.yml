name: Peek at the FTP box SSH logs (one-off)

# Read-only one-off. Deleted again once the question it asks is answered.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Errors from fail2ban since the restart
        run: |
          sudo -n awk '$1 == "2026-10-02" && $2 >= "07:06:55"' /var/log/fail2ban.log | grep -E 'ERROR|WARNING|CRITICAL|xtables|lock|loader-ftp\]' | grep -v 'Found' | head -30
          echo "--- chains and rules now"
          sudo -n iptables -S | grep -i f2b
          echo "--- is fast jail's action alive"
          sudo -n fail2ban-client get loader-ftp actionproperties iptables-multiport 2>&1 | head -10
