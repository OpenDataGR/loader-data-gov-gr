name: Peek at the FTP box SSH logs (one-off)

# Read-only one-off. Deleted again once the question it asks is answered.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Are the fail2ban firewall rules all in place?
        run: |
          echo "--- every INPUT rule that mentions f2b"
          sudo -n iptables -S INPUT | grep -n -i f2b || echo "(none)"
          echo "--- all fail2ban chains"
          sudo -n iptables -S | grep -E '^-N f2b' || echo "(none)"
          echo "--- loader-ftp jail"
          sudo -n fail2ban-client status loader-ftp
          echo "--- is it still the same fail2ban process since provisioning"
          systemctl show fail2ban -p ActiveEnterTimestamp
          echo "--- last fail2ban log lines about loader-ftp"
          sudo -n grep -E 'loader-ftp\]' /var/log/fail2ban.log | tail -12
