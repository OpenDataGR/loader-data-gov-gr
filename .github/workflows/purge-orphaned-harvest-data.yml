name: Purge orphaned harvest data (one-off)
on:
  workflow_dispatch:
jobs:
  purge:
    runs-on: [self-hosted, loader]
    steps:
      - name: Delete orphaned rows for the sftp-storage-proof source id
        run: |
          cd /opt/data-projects/loader-data-gov-gr-postgres
          sudo docker compose exec -T postgres psql -U postgres -d loader_harvest <<'EOSQL'
          DELETE FROM harvested_file
            WHERE run_id IN (SELECT id FROM harvest_run WHERE source_id = '07ac7df1-e13b-412a-aa83-d4d0308d3324');
          DELETE FROM harvested_record
            WHERE run_id IN (SELECT id FROM harvest_run WHERE source_id = '07ac7df1-e13b-412a-aa83-d4d0308d3324');
          DELETE FROM harvest_run WHERE source_id = '07ac7df1-e13b-412a-aa83-d4d0308d3324';
          SELECT count(*) AS remaining_runs FROM harvest_run;
          EOSQL
