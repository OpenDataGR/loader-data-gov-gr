name: Log viewer live test (one-off)

# One-off, read-only, on the loader VM: (1) the HTTP box reads its own journals (loader, nginx) as the
# service user; (2) an FTP box is asked for its proftpd log the way the page does it, through loader's
# database and the box's heartbeat, and its answer is shown. Nothing is changed or restarted.
# Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          cd /opt/data-projects/loader-data-gov-gr
          venv/bin/python - <<'PY'
          import datetime, sqlite3, sys, time, uuid
          from providerharvest_service import http_box

          failed = False
          for service in ("loader", "nginx"):
              ok, text = http_box.read_logs(service, 50)
              lines = text.splitlines()
              print("HTTP box, %s: ok=%s, %d lines; first: %s" % (service, ok, len(lines), lines[1][:110] if len(lines) > 1 else lines))
              failed |= not ok

          conn = sqlite3.connect("/opt/data-projects/loader-data-gov-gr/data/loader.db", timeout=30)
          host = conn.execute("SELECT hostname FROM ftp_box_status").fetchone()[0]
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None).strftime("%Y-%m-%d %H:%M:%S.%f")
          ids = {}
          for service in ("proftpd", "sshd"):
              cid = str(uuid.uuid4())
              ids[cid] = service
              conn.execute("INSERT INTO ftp_box_command (id, hostname, action, requested_by, requested_at, state, output) VALUES (?,?,?,?,?,?,?)",
                           (cid, host, "logs-%s-50" % service, "live-test", now, "pending", ""))
          conn.commit()
          try:
              for _ in range(30):
                  rows = {cid: conn.execute("SELECT state, output FROM ftp_box_command WHERE id = ?", (cid,)).fetchone() for cid in ids}
                  if all(r[0] in ("ok", "failed", "expired") for r in rows.values()):
                      break
                  time.sleep(10)
              for cid, (state, output) in rows.items():
                  lines = output.splitlines()
                  print("FTP box, %s: state=%s, %d chars, %d lines; header: %s" % (ids[cid], state, len(output), len(lines), lines[0][:80] if lines else ""))
                  failed |= state != "ok"
          finally:
              conn.execute("DELETE FROM ftp_box_command WHERE requested_by = 'live-test'")
              conn.commit()
          sys.exit(1 if failed else 0)
          PY
