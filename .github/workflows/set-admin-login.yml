name: Set admin login env vars (one-off)

# One-time: adds LOADER_ADMIN_UI_USERNAME / LOADER_ADMIN_UI_PASSWORD_HASH
# / LOADER_ADMIN_SESSION_SECRET to the env file if not already there,
# then restarts the service to pick them up (editing the env file
# alone does not affect an already-running process). The actual values
# are GitHub Actions secrets, never committed to this file -- GitHub
# redacts them in logs, and the secrets themselves are deleted once
# confirmed safely on the VM. Deleted after a single run, same as
# every other one-off workflow.
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: [self-hosted, loader]
    env:
      ADMIN_UI_USERNAME: ${{ secrets.LOADER_ADMIN_UI_USERNAME }}
      ADMIN_UI_PASSWORD_HASH: ${{ secrets.LOADER_ADMIN_UI_PASSWORD_HASH }}
      ADMIN_SESSION_SECRET: ${{ secrets.LOADER_ADMIN_SESSION_SECRET }}
    steps:
      - name: Add each env var if missing, then restart
        run: |
          add_if_missing() {
            name="$1"
            value="$2"
            if sudo grep -q "^${name}=" /etc/loader-data-gov-gr.env 2>/dev/null; then
              echo "$name already set -- not overwriting"
            else
              echo "${name}=${value}" | sudo tee -a /etc/loader-data-gov-gr.env > /dev/null
              echo "$name added."
            fi
          }
          add_if_missing LOADER_ADMIN_UI_USERNAME "$ADMIN_UI_USERNAME"
          add_if_missing LOADER_ADMIN_UI_PASSWORD_HASH "$ADMIN_UI_PASSWORD_HASH"
          add_if_missing LOADER_ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"

          sudo pkill -TERM -u localadmin -f "gunicorn.*providerharvest_service.app:app" || true
          sleep 3
          curl -sf http://127.0.0.1:5002/health && echo " -- service back up"
