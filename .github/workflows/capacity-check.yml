name: Runner capacity check (one-off)

# One-off, read-only: how loaded each VM is, and what is already running on it, to judge whether
# a second self-hosted runner fits. Installs and changes nothing. Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  loader-vm:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          echo "=== cpus / memory / disk"; nproc; free -m; df -h / | tail -1
          echo "=== load now and cpu over 8 seconds (idle %)"; uptime; vmstat 2 4 | tail -4
          echo "=== runner services on this VM"; systemctl list-units 'actions.runner*' --no-legend --all 2>/dev/null || true
          ls -d /opt/actions-runner* "$HOME"/actions-runner* /home/*/actions-runner* 2>/dev/null || true
          echo "=== biggest memory users (rss MB)"; ps -eo rss,pcpu,user,args --sort=-rss | head -14 | awk '{printf "%7.0f MB  %5s%%  %-10s ", $1/1024, $2, $3; for(i=4;i<=NF&&i<9;i++) printf "%s ", $i; print ""}'
          echo "=== gunicorn workers (rss MB each)"; ps -eo rss,args | grep '[g]unicorn.*providerharvest' | awk '{printf "%.0f MB\n", $1/1024}'
          echo "=== peak this job-like workload: test suite RSS is not measured here"
          echo "=== swap"; swapon --show || true

  ftp-vm:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - run: |
          echo "=== cpus / memory / disk"; nproc; free -m; df -h / | tail -1
          echo "=== load now and cpu over 8 seconds (idle %)"; uptime; vmstat 2 4 | tail -4
          echo "=== runner services on this VM"; systemctl list-units 'actions.runner*' --no-legend --all 2>/dev/null || true
          echo "=== biggest memory users (rss MB)"; ps -eo rss,pcpu,user,args --sort=-rss | head -10 | awk '{printf "%7.0f MB  %5s%%  %-10s ", $1/1024, $2, $3; for(i=4;i<=NF&&i<9;i++) printf "%s ", $i; print ""}'
