name: Run history count (one-off)

# One-off, read-only: how many runs and stored files each source has in the harvest database, how
# far back they go and how much space the files take. Reads the service's own database settings
# (never printed). Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  count:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          set -a; . /etc/loader-data-gov-gr.env; set +a
          cd /opt/data-projects/loader-data-gov-gr
          venv/bin/python - <<'PY'
          from sqlalchemy import text
          from providerharvest_service import harvest_db

          with harvest_db.get_session_factory()() as s:
              print("--- runs per source (all kept, not just the 20 shown)")
              rows = s.execute(text("""
                  SELECT r.source_name, count(*) AS runs,
                         count(*) FILTER (WHERE r.status = 'success') AS ok,
                         count(*) FILTER (WHERE r.status = 'error') AS errors,
                         min(r.started_at)::text AS first_run, max(r.started_at)::text AS last_run
                  FROM harvest_run r GROUP BY r.source_name ORDER BY runs DESC""")).all()
              for r in rows:
                  print(tuple(r))
              print("--- stored files per source")
              for r in s.execute(text("""
                  SELECT r.source_name, count(f.id) AS files, pg_size_pretty(coalesce(sum(f.size), 0)) AS bytes,
                         pg_size_pretty(coalesce(avg(f.size), 0)::bigint) AS avg_file
                  FROM harvest_run r LEFT JOIN harvested_file f ON f.run_id = r.id GROUP BY r.source_name ORDER BY count(f.id) DESC""")).all():
                  print(tuple(r))
              print("--- records per source")
              for r in s.execute(text("""
                  SELECT r.source_name, count(rec.id) FROM harvest_run r JOIN harvested_record rec ON rec.run_id = r.id GROUP BY r.source_name""")).all():
                  print(tuple(r))
              print("--- database size:", s.execute(text("SELECT pg_size_pretty(pg_database_size(current_database()))")).scalar())
              print("--- runs per day, newest 8 days (attica-like push sources)")
              for r in s.execute(text("""
                  SELECT started_at::date AS day, source_name, count(*) FROM harvest_run
                  GROUP BY 1, 2 ORDER BY 1 DESC, 3 DESC LIMIT 12""")).all():
                  print(tuple(r))
          PY
