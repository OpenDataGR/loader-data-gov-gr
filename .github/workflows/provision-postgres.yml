name: Provision shared PostgreSQL (one-off)

# Manual-only, one-time provisioning: a single postgres:16 container at
# /opt/shared-infra/postgres, meant to be shared across projects on this
# VM (not just loader-data-gov-gr) -- see this repo's own conversation
# history for why. Bound to 127.0.0.1 only. Creates loader's own
# database/role; does NOT create anything for any other project --
# that happens later, on demand, when a project actually needs it.
#
# Deliberately lives outside /opt/data-projects/loader-data-gov-gr --
# this is cross-project infrastructure, not this service's own concern.
on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: [self-hosted, loader]
    steps:
      - name: Confirm docker compose is available
        run: sudo docker compose version

      - name: Create the compose project directory
        run: |
          sudo mkdir -p /opt/shared-infra/postgres/data
          sudo chown -R localadmin:localadmin /opt/shared-infra

      - name: Write docker-compose.yml
        run: |
          sudo -u localadmin tee /opt/shared-infra/postgres/docker-compose.yml > /dev/null <<'EOF'
          services:
            postgres:
              image: postgres:16
              container_name: shared-postgres
              restart: unless-stopped
              ports:
                - "127.0.0.1:5432:5432"
              environment:
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - pgdata:/var/lib/postgresql/data
              mem_limit: 2g
              cpus: 1.0
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 5s
                timeout: 5s
                retries: 10
          volumes:
            pgdata:
          EOF

      - name: Write the compose .env (superuser password, chmod 600)
        run: |
          sudo -u localadmin tee /opt/shared-infra/postgres/.env > /dev/null <<EOF
          POSTGRES_PASSWORD=${{ secrets.ONETIME_PG_SUPERUSER_PW }}
          EOF
          sudo chmod 600 /opt/shared-infra/postgres/.env

      - name: Start the container
        run: |
          cd /opt/shared-infra/postgres
          sudo docker compose up -d
          echo "--- waiting for healthy ---"
          for i in $(seq 1 24); do
            status=$(sudo docker inspect --format='{{.State.Health.Status}}' shared-postgres 2>/dev/null || echo "starting")
            echo "status: $status"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          sudo docker ps --filter name=shared-postgres

      - name: Verify the resource caps were actually applied, not silently ignored
        run: |
          echo "--- memory limit (bytes; expect 2147483648 for 2g) ---"
          sudo docker inspect shared-postgres --format='{{.HostConfig.Memory}}'
          echo "--- CPU quota (NanoCpus; expect 1000000000 for 1.0 cpu) ---"
          sudo docker inspect shared-postgres --format='{{.HostConfig.NanoCpus}}'

      - name: Create loader's own database and role (least privilege)
        run: |
          cd /opt/shared-infra/postgres
          sudo docker compose exec -T postgres psql -U postgres <<EOF
          SELECT 'CREATE DATABASE loader_harvest' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'loader_harvest')\gexec
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'loader_harvest_app') THEN
              CREATE ROLE loader_harvest_app LOGIN PASSWORD '${{ secrets.ONETIME_PG_LOADER_APP_PW }}';
            END IF;
          END
          \$\$;
          GRANT ALL PRIVILEGES ON DATABASE loader_harvest TO loader_harvest_app;
          EOF

      - name: Verify with the actual app credentials, not just superuser
        run: |
          cd /opt/shared-infra/postgres
          sudo docker compose exec -T -e PGPASSWORD='${{ secrets.ONETIME_PG_LOADER_APP_PW }}' postgres \
            psql -U loader_harvest_app -d loader_harvest -h 127.0.0.1 -c "SELECT current_user, current_database();"

      - name: Store loader's own connection string (append, never overwrite)
        run: |
          if sudo grep -q '^LOADER_HARVEST_DB_URL=' /etc/loader-data-gov-gr.env 2>/dev/null; then
            echo "LOADER_HARVEST_DB_URL already present -- refusing to duplicate/overwrite it."
            exit 1
          fi
          sudo tee -a /etc/loader-data-gov-gr.env > /dev/null <<EOF
          LOADER_HARVEST_DB_URL=postgresql://loader_harvest_app:${{ secrets.ONETIME_PG_LOADER_APP_PW }}@127.0.0.1:5432/loader_harvest
          EOF
          echo "--- resulting file (values redacted by GitHub, keys only) ---"
          sudo sed 's/=.*/=<redacted>/' /etc/loader-data-gov-gr.env
