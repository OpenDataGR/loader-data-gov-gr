name: Debug rebex listing (one-off)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: [self-hosted, loader]
    steps:
      - name: Inspect the actual stored source row
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          ./venv/bin/python -c "
          import os
          os.environ.setdefault('LOADER_DB_PATH', 'data/loader.db')
          from providerharvest_service import db, provider_sources
          session = db.SessionLocal()
          source = provider_sources.get_or_404(session, '1169d0f1-36ba-44ca-976e-dace0918710e')
          print('transport_type:', source.transport_type)
          print('auth_type:', source.auth_type)
          print('endpoint_url:', source.endpoint_url)
          print('status:', source.status)
          print('config:', source.config)
          "
