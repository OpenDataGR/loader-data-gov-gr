name: Debug rebex listing (one-off)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: [self-hosted, loader]
    steps:
      - name: Reproduce with this project's own SFTPTransport
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          ./venv/bin/python -c "
          from providerharvest_service.engine.transport.sftp import SFTPTransport
          from providerharvest_service.engine.secrets.base import SecretBundle

          secret = SecretBundle(fields={'username': 'demo', 'password': 'password'})
          t = SFTPTransport(
              'test.rebex.net', secret=secret, remote_path='/', glob_pattern='readme.txt',
              pinned_host_key_fingerprint='SHA256:d7Te2DHmvBNSWJNBWik2KbDTjmWtYHe2bvXTMM9lVg4',
          )
          with t:
              page = t.list_entries(cursor=None)
              print('entries:', [(e.ref, e.metadata) for e in page.entries])
              for entry in page.entries:
                  handle = t.open_entry(entry)
                  print('content:', handle.read())
                  handle.close()
          "
