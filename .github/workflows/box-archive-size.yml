name: Box archive size (one-off)

# One-off, read-only, on the FTP box: how many forwarded files are kept in each account's archive and how
# much space they take. Lists nothing but counts and sizes. Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  size:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - run: |
          echo "--- per account: files waiting / archived, and sizes"
          for d in /srv/ftp/*/; do
            name=$(basename "$d")
            waiting=$(sudo -n find "$d" -maxdepth 1 -type f | wc -l)
            archived=$(sudo -n find "$d/.forwarded" -type f 2>/dev/null | wc -l)
            size=$(sudo -n du -sh "$d/.forwarded" 2>/dev/null | cut -f1)
            hours=$(sudo -n find "$d/.forwarded" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
            oldest=$(sudo -n find "$d/.forwarded" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort | head -1)
            echo "$name: waiting=$waiting archived=$archived size=${size:-0} hour-folders=$hours oldest=$oldest"
          done
          echo "--- disk"
          df -h /srv/ftp | tail -1
          echo "--- is anything cleaning the archive? (cron / timers / logrotate mentioning .forwarded or /srv/ftp)"
          sudo -n grep -rl -E "forwarded|/srv/ftp" /etc/cron* /etc/logrotate.d /etc/systemd/system 2>/dev/null || echo "none found"
