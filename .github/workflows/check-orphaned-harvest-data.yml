name: Check orphaned harvest data (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, loader]
    steps:
      - name: Show whatever remains
        run: |
          cd /opt/data-projects/loader-data-gov-gr-postgres
          sudo docker compose exec -T postgres psql -U postgres -d loader_harvest -c \
            "SELECT id, source_id, source_name, status, started_at FROM harvest_run;"
