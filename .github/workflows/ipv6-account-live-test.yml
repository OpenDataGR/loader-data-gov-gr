name: IPv6-limited FTP account live test (one-off)

# One-off, on the live service. Two throwaway accounts, added to loader's database like the
# admin page would (and removed again whatever happens):
#   v6lt-in   allowed from this box's own IPv6 /64 -> must get in over IPv6, FTP (21) and SFTP (2222)
#   v6lt-out  allowed from 2001:db8::/32 only      -> must be refused over IPv6
# The box connects to itself over its own global IPv6 address. Nothing else is touched.
# Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  add:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          /opt/data-projects/loader-data-gov-gr/venv/bin/python - <<'PY'
          import bcrypt, datetime, sqlite3, uuid
          conn = sqlite3.connect("/opt/data-projects/loader-data-gov-gr/data/loader.db", timeout=30)
          h = bcrypt.hashpw(b"v6-live-test-pw-9", bcrypt.gensalt(rounds=12)).decode().replace("$2b$", "$2a$", 1)
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None).strftime("%Y-%m-%d %H:%M:%S.%f")
          conn.execute("DELETE FROM ftp_allowed_ip WHERE ftp_account_id IN (SELECT id FROM ftp_account WHERE username LIKE 'v6lt-%')")
          conn.execute("DELETE FROM ftp_account WHERE username LIKE 'v6lt-%'")
          for name, cidr in (("v6lt-in", "2001:648:2ffc:1225::/64"), ("v6lt-out", "2001:db8::/32")):
              aid = str(uuid.uuid4())
              conn.execute("INSERT INTO ftp_account (id, username, password_hash, home_directory, protocol, enabled, created_at) VALUES (?,?,?,?,?,?,?)",
                           (aid, name, h, "/srv/ftp/" + name, "ftp", 1, now))
              conn.execute("INSERT INTO ftp_allowed_ip (id, ftp_account_id, cidr, created_at) VALUES (?,?,?,?)", (str(uuid.uuid4()), aid, cidr, now))
          conn.commit()
          print("accounts added")
          PY

  test:
    needs: add
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Wait until the box has applied the limits
        run: |
          for i in $(seq 1 30); do
            if sudo -n grep -q "2001:648:2ffc:1225::/64" /etc/proftpd/conf.d/loader-ip-limits.conf 2>/dev/null && [ -d /srv/ftp/v6lt-in ]; then echo "applied after $i checks"; break; fi
            sleep 10
          done
          echo "--- generated rules"; sudo -n cat /etc/proftpd/conf.d/loader-ip-limits.conf
          sudo -n proftpd -t && echo "proftpd -t: ok"

      - name: Log in over IPv6
        run: |
          A6=$(ip -6 addr show scope global | awk '/inet6/ {print $2; exit}' | cut -d/ -f1)
          echo "this box, over IPv6: $A6"
          python3 -m venv /tmp/v6v && /tmp/v6v/bin/pip install -q paramiko
          cat > /tmp/v6try.py <<'PY'
          import ftplib, os, sys, paramiko, logging
          logging.getLogger("paramiko").setLevel(logging.CRITICAL)
          A6, PW = os.environ["A6"], "v6-live-test-pw-9"
          cases = [("v6lt-in", True), ("v6lt-out", False)]
          ok = True
          for user, want in cases:
              for proto, port in (("FTP", 21), ("SFTP", 2222)):
                  try:
                      if proto == "FTP":
                          f = ftplib.FTP(); f.connect(A6, port, timeout=20)
                          try:
                              f.login(user, PW); f.quit(); got, note = True, "LOGGED IN"
                          except (ftplib.error_perm, EOFError, ConnectionError):
                              got, note = False, "refused"
                      else:
                          c = paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                          try:
                              c.connect(A6, port, username=user, password=PW, allow_agent=False, look_for_keys=False, timeout=20)
                              c.open_sftp().listdir(".")
                              got, note = True, "LOGGED IN"
                          except (paramiko.AuthenticationException, paramiko.SSHException, EOFError, ConnectionError):
                              got, note = False, "refused"
                          finally:
                              c.close()
                  except Exception as e:
                      got, note = None, "ERROR %r" % e
                  good = got == want
                  ok &= good
                  print("%-5s %-9s over IPv6 to the live port %-4d expected %-7s -> %-9s [%s]" % (proto, user, port, "in" if want else "refused", note, "ok" if good else "WRONG"))
          sys.exit(0 if ok else 1)
          PY
          A6=$A6 /tmp/v6v/bin/python /tmp/v6try.py

      - name: Clean up on the box
        if: always()
        run: |
          rm -rf /tmp/v6v /tmp/v6try.py
          A6=$(ip -6 addr show scope global | awk '/inet6/ {print $2; exit}' | cut -d/ -f1)
          for j in loader-ftp loader-ftp-slow sshd; do sudo -n fail2ban-client set $j unbanip "$A6" >/dev/null 2>&1 || true; done
          echo "cleaned up"

  remove:
    needs: [add, test]
    if: always()
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          python3 - <<'PY'
          import sqlite3
          conn = sqlite3.connect("/opt/data-projects/loader-data-gov-gr/data/loader.db", timeout=30)
          conn.execute("DELETE FROM ftp_allowed_ip WHERE ftp_account_id IN (SELECT id FROM ftp_account WHERE username LIKE 'v6lt-%')")
          conn.execute("DELETE FROM ftp_account WHERE username LIKE 'v6lt-%'")
          conn.commit()
          print("accounts removed")
          PY
