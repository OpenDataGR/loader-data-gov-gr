name: Check harvested_file schema (one-off)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, loader]
    steps:
      - name: Confirm the new table exists with the expected columns
        run: |
          cd /opt/data-projects/loader-data-gov-gr-postgres
          sudo docker compose exec -T postgres psql -U postgres -d loader_harvest -c "\d harvested_file"
