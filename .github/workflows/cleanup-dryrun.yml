name: Clean up the FTP dry-run folder (one-off)

# One-off: removes the home folder left behind on the FTP box by the
# end-to-end dry run of self-service FTP push registration (its source
# and account were already deleted through the normal portal flow; only
# the folder and its archived test files remain). Deleted after one run.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: [self-hosted, loader-ftp]
    timeout-minutes: 5
    steps:
      - name: Remove the dry-run folder
        run: |
          # The account must be gone from the box's own database first
          # (account-sync removes it within a minute of the source being
          # deleted) -- refuse to delete a folder a live login points at.
          if sudo -n sqlite3 /etc/proftpd/ftp-accounts.db "SELECT 1 FROM ftp_account WHERE username = 'zz-dryrun';" | grep -q 1; then
            echo "::error::zz-dryrun still exists in the box's account database -- not removing its folder"
            exit 1
          fi
          sudo -n ls -la /srv/ftp/zz-dryrun || true
          sudo -n rm -rf -- /srv/ftp/zz-dryrun
          sudo -n ls -la /srv/ftp
