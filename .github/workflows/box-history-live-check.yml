name: Box history live check (one-off)

# One-off, read-only: waits a few minutes, then shows what the loader database holds in box_sample
# (one row per box per five minutes) and that the sampler thread is running in the service.
# Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          python3 - <<'PY'
          import sqlite3, subprocess, sys, time
          conn = sqlite3.connect("/opt/data-projects/loader-data-gov-gr/data/loader.db", timeout=30)
          for _ in range(14):
              n = conn.execute("SELECT count(DISTINCT hostname) FROM box_sample").fetchone()[0]
              if n >= 2:
                  break
              time.sleep(30)
          print("--- samples per box")
          for row in conn.execute("SELECT hostname, count(*), min(at), max(at) FROM box_sample GROUP BY hostname"):
              print(row)
          print("--- latest rows (host, at, load%, mem%, disk%, rx, tx, sessions)")
          for row in conn.execute("SELECT hostname, at, load_pct, mem_pct, disk_pct, rx_bps, tx_bps, sessions FROM box_sample ORDER BY at DESC LIMIT 6"):
              print(row)
          pid = subprocess.run(["systemctl", "show", "-p", "MainPID", "--value", "loader-data-gov-gr"], capture_output=True, text=True).stdout.strip()
          threads = subprocess.run("ls /proc/%s/task | wc -l" % pid, shell=True, capture_output=True, text=True).stdout.strip()
          print("--- threads in the gunicorn master:", threads)
          log = subprocess.run("journalctl -u loader-data-gov-gr --since '-20min' --no-pager | grep -i 'box history' || true", shell=True, capture_output=True, text=True).stdout.strip()
          print("--- sampler errors logged:", log or "none")
          sys.exit(0 if n >= 2 else 1)
          PY
