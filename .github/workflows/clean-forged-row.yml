name: Remove the forged test rows from the failed-login report (one-off)

# One-off. During the newline-injection test a forged attempt (address 9.9.9.9, username
# "forged-entry") reached the report before the fix. Shows what matches, deletes exactly
# those rows, shows the result. Deleted again afterwards.
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: [self-hosted, loader]
    steps:
      - name: Look, delete, look again
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          db = "/opt/data-projects/loader-data-gov-gr/data/loader.db"
          conn = sqlite3.connect(db)
          where = "username IN ('forged-entry','forged-again') AND ip IN ('9.9.9.9','8.8.8.8')"
          print("--- rows matching, before")
          for row in conn.execute("SELECT id, hostname, at, ip, port, username, channel FROM ftp_login_attempt WHERE " + where):
              print(row)
          conn.execute("DELETE FROM ftp_login_attempt WHERE " + where)
          conn.commit()
          print("--- rows matching, after:", conn.execute("SELECT count(*) FROM ftp_login_attempt WHERE " + where).fetchone()[0])
          print("--- the genuine probes are untouched:")
          for row in conn.execute("SELECT at, ip, port, username, channel FROM ftp_login_attempt WHERE username LIKE 'zz-%' ORDER BY at DESC LIMIT 6"):
              print(row)
          PY
