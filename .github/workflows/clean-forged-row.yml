name: Remove the forged test rows from the failed-login report (one-off)

# One-off. During the newline-injection test a forged attempt (address 9.9.9.9, username
# "forged-entry") reached the report before the fix. Shows what matches, deletes exactly
# those rows, shows the result. Deleted again afterwards.
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: [self-hosted, loader]
    steps:
      - name: Look, delete, look again
        run: |
          DB=/opt/data-projects/loader-data-gov-gr/data/loader.db
          test -f "$DB" || { echo "::error::no database at $DB"; exit 1; }
          echo "--- rows matching, before"
          sqlite3 "$DB" "SELECT id, hostname, at, ip, port, username, channel FROM ftp_login_attempt WHERE username = 'forged-entry' OR username = 'forged-again' OR ip IN ('9.9.9.9','8.8.8.8');"
          sqlite3 "$DB" "DELETE FROM ftp_login_attempt WHERE username IN ('forged-entry','forged-again') AND ip IN ('9.9.9.9','8.8.8.8');"
          echo "--- rows matching, after"
          sqlite3 "$DB" "SELECT count(*) FROM ftp_login_attempt WHERE username IN ('forged-entry','forged-again');"
