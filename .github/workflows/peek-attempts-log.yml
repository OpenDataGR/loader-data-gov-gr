name: Peek at the raw ProFTPD attempt logs (one-off)

# Read-only one-off: did a username containing a newline split a log line?
# Deleted again once looked at.
on:
  workflow_dispatch:

jobs:
  peek:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - name: Last lines of the attempts log mentioning the probe, raw
        run: |
          echo "--- loader-attempts.log (cat -A shows control characters)"
          sudo -n grep -n -B1 -A2 'zz-nl-probe\|forged-entry' /var/log/proftpd/loader-attempts.log | cat -A | tail -12 || echo "(no match)"
          echo "--- loader-auth.log (what fail2ban reads; must be untouched by the username)"
          sudo -n grep -c 'forged-entry\|zz-nl-probe' /var/log/proftpd/loader-auth.log || true
          echo "--- is 9.9.9.9 in any jail (it must not be)"
          sudo -n fail2ban-client banned 2>/dev/null | grep -c '9.9.9.9' || true
