name: Remove throwaway test directories (one-off)

# One-off, on the FTP box: removes the empty/throwaway account directories left by earlier live tests
# (rt-test, v6lt-in, v6lt-out). Only those three names, only if no such account exists any more.
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: [self-hosted, loader-ftp]
    steps:
      - run: |
          DB=$(systemctl cat loader-ftp-forwarder-sync | grep -o -- '--db-path [^ ]*' | head -1 | cut -d' ' -f2)
          for name in rt-test v6lt-in v6lt-out; do
            n=$(sudo -n python3 -c "import sqlite3; print(sqlite3.connect('$DB').execute('SELECT count(*) FROM ftp_account WHERE username = ?', ('$name',)).fetchone()[0])")
            if [ "$n" = "0" ] && [ -d "/srv/ftp/$name" ]; then
              sudo -n rm -rf "/srv/ftp/$name" && echo "removed /srv/ftp/$name"
            else
              echo "left /srv/ftp/$name (account rows: $n)"
            fi
          done
          ls /srv/ftp
