name: Sample XML look (one-off)

# One-off, read-only: the newest stored Detector.xml of the attica source -- its size, the start of the text, and
# a summary of its structure (element names, counts, attribute names, a few example values). Changes nothing.
# Deleted afterwards.
on:
  workflow_dispatch:

jobs:
  look:
    runs-on: [self-hosted, loader]
    steps:
      - run: |
          set -a; . /etc/loader-data-gov-gr.env; set +a
          cd /opt/data-projects/loader-data-gov-gr
          venv/bin/python - <<'PY'
          import collections, xml.etree.ElementTree as ET
          from sqlalchemy import text
          from providerharvest_service import harvest_db

          with harvest_db.get_session_factory()() as s:
              row = s.execute(text("""
                  SELECT f.filename, f.size, f.fetched_at::text, f.content
                  FROM harvested_file f JOIN harvest_run r ON r.id = f.run_id
                  WHERE r.source_name = 'attica-region-traffic-data' AND length(f.content) > 0
                  ORDER BY f.fetched_at DESC LIMIT 1""")).one()
          name, size, at, content = row
          print("file:", name, "size:", size, "at:", at)
          print("--- first 1800 characters")
          print(content[:1800].decode("utf-8", "replace"))
          print("--- structure")
          root = ET.fromstring(content)
          print("root:", root.tag, dict(list(root.attrib.items())[:8]))
          counts = collections.Counter()
          attrs = collections.defaultdict(set)
          examples = {}
          for el in root.iter():
              counts[el.tag] += 1
              for k, v in el.attrib.items():
                  attrs[el.tag].add(k)
                  examples.setdefault((el.tag, k), v)
              if el.text and el.text.strip() and len(list(el)) == 0:
                  examples.setdefault((el.tag, "#text"), el.text.strip()[:40])
          for tag, n in counts.most_common(30):
              print("%-28s x%-6d attrs=%s" % (tag, n, sorted(attrs[tag])))
          print("--- example values")
          for (tag, k), v in list(examples.items())[:40]:
              print("%s %s = %r" % (tag, k, v))
          PY
