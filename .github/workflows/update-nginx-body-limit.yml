name: Update nginx body-size limit (one-off)

# One-off: the nginx vhost config (deploy/nginx-loader.data.gov.gr)
# isn't auto-deployed by deploy.yml -- it's a manual install step (see
# deploy/README.md), so a change to it needs applying by hand. Pulls
# the latest checkout, copies the current checked-in file over the
# installed vhost, and reloads nginx.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: [self-hosted, loader]
    timeout-minutes: 5
    steps:
      - name: Install the updated vhost and reload nginx
        run: |
          cd /opt/data-projects/loader-data-gov-gr
          git pull
          sudo -n cp deploy/nginx-loader.data.gov.gr /etc/nginx/sites-available/loader
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          grep client_max_body_size /etc/nginx/sites-available/loader
