name: Update nginx body-size limit (one-off)

# One-off: the nginx vhost config (deploy/nginx-loader.data.gov.gr)
# isn't auto-deployed by deploy.yml -- it's a manual install step (see
# deploy/README.md), so a change to it needs applying by hand. Copies
# the current checked-in file over the installed vhost and reloads
# nginx.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: [self-hosted, loader]
    timeout-minutes: 5
    steps:
      - name: Install the updated vhost and reload nginx
        run: |
          # -n (non-interactive): this VM's sudoers requires a password
          # for some commands (see deploy.yml's own "Why pkill instead
          # of sudo systemctl restart" note) -- -n makes an unauthorized
          # command fail immediately and clearly instead of hanging the
          # whole job waiting on a password that will never come.
          sudo -n cp /opt/data-projects/loader-data-gov-gr/deploy/nginx-loader.data.gov.gr /etc/nginx/sites-available/loader
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          grep client_max_body_size /etc/nginx/sites-available/loader
