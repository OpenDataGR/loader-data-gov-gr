services:
  postgres:
    image: postgres:16
    container_name: shared-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Confirmed applied via `docker inspect` (HostConfig.Memory /
    # HostConfig.NanoCpus), not assumed from this syntax alone --
    # Swarm's `deploy.resources.limits` block is silently ignored
    # outside Swarm mode; these top-level keys are the ones that
    # actually take effect under plain `docker compose up`.
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
